packages:
  - packages/*
  - packages/solid/v2
  - apps/*

catalogs:
  calendar-tsx:
    typescript: 7.0.2
    publint: 0.3.25
    vite-plus: 1.0.0

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    vite: 1.0.0

minimumReleaseAgeExclude:
  - '@solidjs/signals@2.0.0-rc.19'
  - '@solidjs/web@2.0.0-rc.19'
  - solid-js@2.0.0-rc.19
  - '@frantss/fumadocs-theme@0.2.0'
